<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Lumbre</title>
  <defs>
    <radialGradient id="brasa" cx="50%" cy="62%" r="52%">
      <stop offset="0%" stop-color="#FFD36A"/>
      <stop offset="42%" stop-color="#FF7A18"/>
      <stop offset="100%" stop-color="#C4320A"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#FF7A18" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FF7A18" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- resplandor -->
  <circle cx="256" cy="286" r="196" fill="url(#halo)"/>

  <!-- el hogar: dos aguas abiertas, techo que cobija y no encierra -->
  <path d="M256 92 L430 236" stroke="#F3F5F7" stroke-width="30" stroke-linecap="round"/>
  <path d="M256 92 L82 236" stroke="#F3F5F7" stroke-width="30" stroke-linecap="round"/>

  <!-- jambas: se abren hacia abajo, la casa no se cierra -->
  <path d="M110 268 L110 404" stroke="#F3F5F7" stroke-width="26" stroke-linecap="round" opacity="0.55"/>
  <path d="M402 268 L402 404" stroke="#F3F5F7" stroke-width="26" stroke-linecap="round" opacity="0.55"/>

  <!-- la brasa: queda prendida -->
  <path d="M256 196
           C300 236 322 272 322 306
           C322 348 292 378 256 378
           C220 378 190 348 190 306
           C190 272 212 236 256 196 Z"
        fill="url(#brasa)"/>

  <!-- corazon del rescoldo -->
  <path d="M256 268
           C276 290 286 308 286 324
           C286 342 273 354 256 354
           C239 354 226 342 226 324
           C226 308 236 290 256 268 Z"
        fill="#FFF0C4" opacity="0.92"/>
</svg>
